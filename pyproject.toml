[project]
name = "satyori-hybrid-rag"
version = "1.0.0"
description = "Satyori: insight grounded in truth. A hybrid RAG assistant and retrieval lab for property due diligence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
authors = [{ name = "Ch Sai Kaushik" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "groq>=1.7.0",
    "numpy>=2.4.6",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satyori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"bench/chart.py" = ["E501"]  # SVG markup reads better unwrapped

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
